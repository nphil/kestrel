<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Kestrel dashboard fixture</title>
  <style>
    :root { color-scheme: dark; --primary-color:#b8a8ff; --text-primary-color:#171522; --primary-text-color:#ece9f2; --secondary-text-color:#b7b2c4; --disabled-text-color:#858091; --primary-background-color:#17161d; --card-background-color:#26242d; --ha-card-background:#26242d; --ha-card-border-color:#514d5c; --divider-color:#514d5c; --success-color:#82c79a; --warning-color:#e5bd74; --error-color:#e8848f; --info-color:#83bfea; --ha-card-border-radius:24px; --ha-card-box-shadow:0 20px 44px rgba(0,0,0,.25); --ha-font-family-body:system-ui,sans-serif; }
    :root.light { color-scheme:light; --primary-color:#715ca8; --text-primary-color:#fff; --primary-text-color:#282431; --secondary-text-color:#635f6d; --disabled-text-color:#8f8b95; --primary-background-color:#f0eef4; --card-background-color:#fff; --ha-card-background:#fff; --ha-card-border-color:#d8d4de; --divider-color:#d8d4de; --success-color:#317b55; --warning-color:#946313; --error-color:#ad3441; --info-color:#286e9d; --ha-card-box-shadow:0 16px 40px rgba(28,20,42,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--primary-text-color); background:var(--primary-background-color); font-family:system-ui,sans-serif; }
    .fixture-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--divider-color); background:var(--card-background-color); }
    .fixture-controls strong { margin-right:auto; }
    .fixture-controls button { min-height:40px; padding:0 12px; border:1px solid var(--divider-color); border-radius:999px; color:inherit; background:transparent; cursor:pointer; }
    main { min-height:calc(100vh - 60px); }
    kestrel-cameras { display:block; max-width:1600px; margin:0 auto; }
    ha-icon { display:inline-grid; width:20px; height:20px; place-items:center; vertical-align:middle; color:inherit; }
    ha-icon::after { content:"·"; font-size:22px; line-height:1; }
    scrypted-nvr-camera { display:grid !important; min-height:inherit; place-items:center; color:var(--secondary-text-color); background:linear-gradient(140deg,color-mix(in srgb,var(--primary-color) 14%,transparent),transparent 50%),var(--card-background-color); }
    scrypted-nvr-camera::after { content:attr(id) " · " attr(destination) " fixture"; padding:12px; font:12px system-ui; }
    @media (max-width:680px) { .fixture-controls { position:sticky; top:0; z-index:50; } }
  </style>
</head>
<body>
  <div class="fixture-controls" aria-label="Fixture controls">
    <strong>Kestrel local fixture</strong>
    <button id="live">Live</button><button id="visit">Processing visit</button><button id="wildlife">Wildlife</button><button id="insights">AI check-up</button><button id="theme">Switch theme</button>
  </div>
  <main id="root"></main>
  <script type="module" src="./dist/harness.js"></script>
</body>
</html>
